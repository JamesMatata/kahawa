{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage · Kahawa</title>
  <link rel="stylesheet" href="{% static 'css/kahawa.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/scrollbar.css' %}">
  <link rel="stylesheet" href="{% static 'css/controls.css' %}">
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .font-display { font-family: 'Fredoka', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-full bg-ink-950 text-slate-100 antialiased" data-toast-theme="dark">
  <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(217,119,6,0.14),_transparent_45%)]"></div>
  {% include "partials/toasts.html" with toast_theme="dark" toast_offset="1rem" %}
  <div class="relative z-10 mx-auto flex min-h-full max-w-md flex-col justify-center px-4 py-12">
    <div class="mb-8 text-center">
      <img src="{% static 'images/kahawa-logo.png' %}" alt="Kahawa" class="mx-auto h-10 w-auto brightness-0 invert">
      <p class="mt-3 text-xs font-extrabold uppercase tracking-widest text-caramel-400">Manage</p>
    </div>
    <div class="rounded-3xl bg-ink-850/90 p-6 ring-1 ring-white/5 sm:p-8">
      <h1 class="font-display text-2xl font-semibold text-white">Sign in</h1>
      <p class="mt-1 text-sm font-semibold text-slate-400">Admin and staff access for Kahawa ops.</p>
      {% if error %}
        <p class="mt-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm font-bold text-red-300 ring-1 ring-red-500/20" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <label class="block">
          <span class="mb-1.5 block text-[11px] font-extrabold uppercase tracking-wide text-slate-500">Username</span>
          <input type="text" name="username" value="{{ username }}" required autofocus class="w-full rounded-2xl border-0 bg-ink-950 px-4 py-3 text-sm font-bold text-white ring-1 ring-white/10 outline-none focus:ring-2 focus:ring-caramel-500">
        </label>
        <label class="block">
          <span class="mb-1.5 block text-[11px] font-extrabold uppercase tracking-wide text-slate-500">Password</span>
          <input type="password" name="password" required class="w-full rounded-2xl border-0 bg-ink-950 px-4 py-3 text-sm font-bold text-white ring-1 ring-white/10 outline-none focus:ring-2 focus:ring-caramel-500">
        </label>
        <button type="submit" class="w-full rounded-full bg-caramel-600 py-3.5 text-sm font-extrabold text-white hover:bg-caramel-500">
          Sign in
        </button>
      </form>
    </div>
    <p class="mt-6 text-center text-xs font-semibold text-slate-500">
      <a href="{% url 'kahawa:home' %}" class="text-slate-400 hover:text-caramel-400">← Back to storefront</a>
    </p>
  </div>
</body>
</html>
